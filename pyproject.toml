[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgflow"
version = "0.1.0"
description = "Modüler görüntü işleme pipeline aracı"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "black>=24.0",
    "pyinstaller>=6.5",
    "pyinstaller-hooks-contrib>=2024.0",
    "onnx>=1.15",
    "pillow>=10.0",
]
camera = [
    "pypylon>=3.0",
]
ml = [
    "onnxruntime>=1.17",
]

[project.gui-scripts]
imgflow = "imgflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.black]
line-length = 100
